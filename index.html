<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PakPulse | پاکستان قومی ڈیش بورڈ</title>
<meta name="description" content="Pakistan's national economic dashboard in plain English and Urdu.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇵🇰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07130f;--panel:#0e211a;--panel2:#13291f;--line:#1f3b30;--tx:#e8f3ee;--mut:#8fb0a2;--acc:#2ee59d;--acc2:#f5c542;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0f3d2c 0,var(--bg) 60%);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif;line-height:2}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 0 16px}
h1{margin:0;font-size:1.6rem}h1 span{color:var(--acc)}.sub{color:var(--mut);font-size:.9rem}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit}
button{cursor:pointer}button:hover,button.on{border-color:var(--acc);color:var(--acc)}
#clock{font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.tools input{flex:1;min-width:200px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card .k{color:var(--mut);font-size:.85rem}.card .v{font-size:1.7rem;font-weight:700;margin:2px 0}.card .v small{font-size:.9rem;color:var(--mut);font-weight:400}
.up{color:var(--acc)}.dn{color:var(--bad)}.src{color:var(--mut);font-size:.72rem}
.ex{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.88rem;color:#cfe6dc}.card.open .ex{display:block}
section{margin-top:28px}h2{font-size:1.2rem;margin:0 0 10px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
label{display:block;font-size:.82rem;color:var(--mut);margin:8px 0 3px}.box input,.box select{width:100%}
.res{margin-top:10px;background:var(--panel2);border-radius:12px;padding:10px;font-size:.95rem}.res b{color:var(--acc2)}
svg text{fill:var(--mut);font-size:11px}.note{color:var(--mut);font-size:.78rem;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.empty{color:var(--mut);padding:20px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1>Pak<span>Pulse</span> 🇵🇰</h1><div class="sub" data-i="tag"></div></div>
 <div class="bar"><div id="clock"></div><button id="lang"></button><button id="csv" data-i="csv"></button></div>
</header>

<div class="tools">
 <input id="q" type="search" data-ph="search">
 <div class="bar" id="cats"></div>
</div>
<div class="grid" id="grid"></div>

<section><h2 data-i="charts"></h2>
 <div class="two">
  <div class="box"><div class="k" data-i="c1"></div><svg id="ch1" viewBox="0 0 400 220" width="100%"></svg></div>
  <div class="box"><div class="k" data-i="c2"></div><svg id="ch2" viewBox="0 0 400 220" width="100%"></svg></div>
 </div>
</section>

<section><h2 data-i="calcs"></h2>
 <div class="two">
  <div class="box"><b data-i="k1"></b>
   <label data-i="usd"></label><input id="r_usd" type="number" value="1000" min="0">
   <label data-i="fx"></label><input id="r_fx" type="number" value="280" min="1">
   <label data-i="tax"></label><input id="r_tax" type="number" value="0.25" step="0.05" min="0">
   <label data-i="fee"></label><input id="r_fee" type="number" value="0" min="0">
   <div class="res" id="r_out"></div></div>
  <div class="box"><b data-i="k2"></b>
   <label data-i="amt"></label><input id="i_amt" type="number" value="100000" min="0">
   <label data-i="from"></label><select id="i_yr"></select>
   <div class="res" id="i_out"></div></div>
  <div class="box"><b data-i="k3"></b>
   <label data-i="loan"></label><input id="l_amt" type="number" value="5000000" min="0">
   <label data-i="ten"></label><input id="l_ten" type="number" value="60" min="1">
   <label data-i="old"></label><input id="l_old" type="number" value="13" step="0.25">
   <label data-i="new"></label><input id="l_new" type="number" value="11" step="0.25">
   <div class="res" id="l_out"></div></div>
 </div>
</section>

<p class="note" data-i="disc"></p>
</div>

<script>
"use strict";
/* ===== DATA ===== Edit values here (or wire to an API later). asof = date of the figure. */
const DATA=[
{id:"policy",cat:"macro",v:10.5,u:"%",d:0,asof:"2026-Q3",src:"SBP",en:"SBP Policy Rate",ur:"اسٹیٹ بینک پالیسی ریٹ",
 xe:"The rate SBP charges banks. Bank loans (car lease, business loan) usually track KIBOR, which follows this. A 1% cut on a Rs 5M loan saves roughly Rs 2,500–3,000 a month.",
 xu:"یہ وہ شرح ہے جس پر اسٹیٹ بینک بینکوں کو قرض دیتا ہے۔ کار لیز اور کاروباری قرضے کبھی کبھار اسی کے ساتھ گھٹتے بڑھتے ہیں۔ 1٪ کمی سے 50 لاکھ کے قرض پر ماہانہ تقریباً 2,500–3,000 روپے بچتے ہیں۔"},
{id:"reserves_sbp",cat:"macro",v:14.5,u:"$Bn",d:0,asof:"2026-Q3",src:"SBP",en:"FX Reserves (SBP)",ur:"زرمبادلہ ذخائر (اسٹیٹ بینک)",
 xe:"Dollars held by the central bank. More reserves = steadier rupee and enough to pay for imports (roughly 2–3 months' cover is healthy).",
 xu:"مرکزی بینک کے پاس ڈالر۔ زیادہ ذخائر کا مطلب مستحکم روپیہ اور درآمدات کی ادائیگی کی صلاحیت۔"},
{id:"reserves_bank",cat:"macro",v:5.0,u:"$Bn",d:0,asof:"2026-Q3",src:"SBP",en:"FX Reserves (Commercial Banks)",ur:"زرمبادلہ ذخائر (کمرشل بینک)",
 xe:"Dollars held by private banks. These are not available to the government, so SBP reserves are the number to watch.",
 xu:"نجی بینکوں کے ڈالر۔ یہ حکومت کے استعمال میں نہیں، اس لیے اسٹیٹ بینک کے ذخائر زیادہ اہم ہیں۔"},
{id:"remit",cat:"macro",v:3.5,u:"$Bn/mo",d:0,asof:"2026-Q3",src:"SBP",en:"Worker Remittances",ur:"ترسیلاتِ زر",

{id:"cpi",cat:"macro",v:5.0,u:"% YoY",d:0,asof:"2026-Q3",src:"PBS",en:"CPI Headline Inflation",ur:"مہنگائی (سی پی آئی)",
 xe:"How much average prices rose versus a year ago. At 5%, something that cost Rs 1,000 last year costs about Rs 1,050 now.",
 xu:"گزشتہ سال کے مقابلے میں قیمتوں میں اضافہ۔ 5٪ پر، پچھلے سال کی 1,000 روپے کی چیز اب تقریباً 1,050 کی ہے۔"},
{id:"spi",cat:"essentials",v:5.0,u:"% YoY",d:0,asof:"2026-Q3",src:"PBS",en:"Sensitive Price Index (SPI)",ur:"حساس قیمتوں کا اشاریہ",
 xe:"Weekly price tracker for 51 everyday items (flour, sugar, milk, vegetables). It shows what households feel first.",

{id:"raast",cat:"fintech",v:8.0,u:"M txns/day",d:0,asof:"2026-Q3",src:"SBP PSR",en:"Raast Transactions (P2P+P2M)",ur:"راست روزانہ لین دین",

{id:"wallets",cat:"fintech",v:90,u:"M accounts",d:0,asof:"2026-Q3",src:"SBP PSR",en:"Mobile Wallet Accounts",ur:"موبائل والٹ اکاؤنٹس",

{id:"itexp",cat:"it",v:3.8,u:"$Bn/yr",d:0,asof:"FY25",src:"PSEB / SBP",en:"IT & IT-enabled Exports",ur:"آئی ٹی برآمدات",

{id:"freelance",cat:"it",v:4,u:"global rank",d:0,asof:"2025",src:"Ministry of IT",en:"Freelancer Ranking",ur:"فری لانسر عالمی درجہ",
 xe:"Pakistan ranks among the top freelancing countries worldwide by number of freelancers.",

{id:"shouses",cat:"it",v:null,u:"",d:0,asof:"—",src:"PSEB",en:"Registered Software Houses (add PSEB figure)",ur:"رجسٹرڈ سافٹ ویئر ہاؤسز (پی ایس ای بی کا عدد شامل کریں)",
 xe:"Fill in the latest count from PSEB's register in the DATA array.",xu:"تازہ تعداد پی ایس ای بی سے لے کر DATA میں درج کریں۔"},
{id:"kse",cat:"markets",v:165000,u:"pts",d:0,asof:"2026-Q3",src:"PSX",en:"KSE-100 Index",ur:"کے ایس ای-100 انڈیکس",
 xe:"The score of Pakistan's 100 biggest listed companies. Up means investors are more confident; it is not guaranteed income.",
 xu:"پاکستان کی 100 بڑی کمپنیوں کا اشاریہ۔ اوپر جانا سرمایہ کاروں کے اعتماد کی علامت ہے، منافع کی ضمانت نہیں۔"},
{id:"secp",cat:"markets",v:2200,u:"cos/mo",d:0,asof:"2026-Q3",src:"SECP",en:"New Company Registrations",ur:"نئی کمپنیوں کی رجسٹریشن",
 xe:"New private limited companies registered each month. A rough signal of how many people are starting businesses.",
 xu:"ہر ماہ رجسٹر ہونے والی نئی پرائیویٹ لمیٹڈ کمپنیاں، کاروبار شروع کرنے کے رجحان کا اشارہ۔"},
{id:"petrol",cat:"essentials",v:255,u:"Rs/L",d:0,asof:"2026-Q3",src:"OGRA",en:"Petrol Price",ur:"پیٹرول کی قیمت",
 xe:"Fortnightly government-set price. It feeds into transport and food costs.",
 xu:"پندرہ روزہ سرکاری قیمت۔ یہ ٹرانسپورٹ اور کھانے پینے کی قیمتوں پر اثر ڈالتی ہے۔"},
{id:"gold",cat:"essentials",v:420000,u:"Rs/tola 24K",d:0,asof:"2026-Q3",src:"Sarafa Assoc.",en:"Gold (24K per tola)",ur:"سونا (24 قیراط فی تولہ)",
 xe:"1 tola ≈ 11.66 g. Follows international gold prices and the dollar rate.",
 xu:"ایک تولہ تقریباً 11.66 گرام۔ عالمی نرخ اور ڈالر ریٹ کے ساتھ بدلتا ہے۔"}
];
const SERIES={m:["M1","M2","M3","M4","M5","M6"],it:[0.31,0.33,0.32,0.35,0.34,0.36],rem:[3.2,3.4,3.3,3.6,3.5,3.5]};
const RAILS=[{n:"Raast",v:38},{n:"1Link",v:30},{n:"Wallets",v:22},{n:"Cards",v:10}];
const CPI_FACTOR={2021:1.95,2022:1.75,2023:1.35,2024:1.1,2025:1.04,2026:1};/* approx. cumulative price change to today */

const T={
en:{tag:"Pakistan's economy in plain language",csv:"Export CSV",search:"Search metrics…",all:"All",macro:"Macroeconomy",fintech:"Fintech",it:"IT & Tech",markets:"Markets",essentials:"Daily Essentials",charts:"Trends",calcs:"Citizen Tools",
c1:"IT exports vs remittances ($Bn/month, indicative)",c2:"Digital payment rails, share of volume % (indicative)",
k1:"Freelancer remittance → net PKR",usd:"Amount received (USD)",fx:"PKR per USD",tax:"PSEB tax % (default 0.25)",fee:"Bank/platform fee (USD)",
k2:"What is my old money worth today?",amt:"Amount then (PKR)",from:"Year",k3:"Rate-cut loan savings",loan:"Loan amount (PKR)",ten:"Months left",old:"Current rate %",new:"New rate %",
gets:"You get",aft:"after tax and fees",eq:"is about",tdy:"in today's prices",emi:"Monthly instalment",now:"now",save:"You save",pm:"per month",tot:"over the loan",none:"No data",tap:"Tap a card for a plain-language explanation",
disc:"Figures are indicative baselines and must be refreshed from official releases (SBP, PBS, PSX, PSEB, SECP, OGRA, Sarafa) — edit the DATA array in index.html. Calculators are estimates, not financial or tax advice."},
ur:{tag:"پاکستان کی معیشت، آسان زبان میں",csv:"سی ایس وی ڈاؤن لوڈ",search:"تلاش کریں…",all:"تمام",macro:"معیشت",fintech:"فن ٹیک",it:"آئی ٹی",markets:"مارکیٹس",essentials:"روزمرہ اشیا",charts:"رجحانات",calcs:"شہری کیلکولیٹر",
c1:"آئی ٹی برآمدات بمقابلہ ترسیلات (ارب ڈالر ماہانہ، اندازاً)",c2:"ڈیجیٹل ادائیگی کے نظام، حصہ ٪ (اندازاً)",
k1:"فری لانسر رقم → خالص روپے",usd:"موصول رقم (ڈالر)",fx:"روپے فی ڈالر",tax:"پی ایس ای بی ٹیکس ٪ (عام 0.25)",fee:"بینک/پلیٹ فارم فیس (ڈالر)",
k2:"پرانی رقم کی آج کیا قدر ہے؟",amt:"اس وقت کی رقم (روپے)",from:"سال",k3:"شرحِ سود میں کمی سے بچت",loan:"قرض کی رقم (روپے)",ten:"باقی مہینے",old:"موجودہ شرح ٪",new:"نئی شرح ٪",
gets:"آپ کو ملیں گے",aft:"ٹیکس اور فیس کے بعد",eq:"تقریباً",tdy:"آج کی قیمتوں میں",emi:"ماہانہ قسط",now:"اب",save:"آپ کی بچت",pm:"ماہانہ",tot:"پورے قرض پر",none:"ڈیٹا نہیں",tap:"آسان وضاحت کے لیے کارڈ پر ٹیپ کریں",
disc:"اعداد و شمار ابتدائی اندازے ہیں؛ سرکاری ذرائع (SBP, PBS, PSX, PSEB, SECP, OGRA) سے تازہ کریں — index.html میں DATA ترمیم کریں۔ کیلکولیٹر صرف اندازہ ہیں، مالی یا ٹیکس مشورہ نہیں۔"}
};
let L=localStorage.getItem("pp_lang")||"en",CAT="all";
const $=s=>document.querySelector(s),t=k=>T[L][k]||k;
const fmt=n=>n==null?"—":new Intl.NumberFormat(L==="ur"?"ur-PK":"en-PK",{maximumFractionDigits:2}).format(n);
const pkr=n=>"Rs "+new Intl.NumberFormat("en-PK",{maximumFractionDigits:0}).format(n);

function applyLang(){
 document.documentElement.lang=L;document.documentElement.dir=L==="ur"?"rtl":"ltr";
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $("#lang").textContent=L==="ur"?"English":"اردو";
 const cats=["all","macro","fintech","it","markets","essentials"];
 $("#cats").innerHTML=cats.map(c=>`<button class="${c===CAT?"on":""}" data-c="${c}">${t(c)}</button>`).join("");
 $("#cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{CAT=b.dataset.c;applyLang()});
 const sel=$("#i_yr"),cur=sel.value||"2021";
 sel.innerHTML=Object.keys(CPI_FACTOR).slice(0,-1).map(y=>`<option ${y===cur?"selected":""}>${y}</option>`).join("");
 render();charts();calc();
}
function render(){
 const q=$("#q").value.trim().toLowerCase();
 const rows=DATA.filter(d=>(CAT==="all"||d.cat===CAT)&&(!q||(d.en+d.ur+d.src).toLowerCase().includes(q)));
 $("#grid").innerHTML=rows.length?rows.map(d=>`<div class="card" onclick="this.classList.toggle('open')">
  <div class="k">${d[L]}</div><div class="v">${fmt(d.v)} <small>${d.u}</small></div>
  <div class="src">${d.src} · ${d.asof}</div><div class="ex">${L==="ur"?d.xu:d.xe}</div></div>`).join(""):`<div class="empty">${t("none")}</div>`;
}
function charts(){
 const W=400,H=220,p=34,mx=4;const x=i=>p+i*(W-2*p)/5,y=v=>H-p-v/mx*(H-2*p);
 const line=(arr,c)=>`<polyline fill="none" stroke="${c}" stroke-width="3" points="${arr.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`+arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${c}"/>`).join("");
 let g="";for(let v=0;v<=4;v++)g+=`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="#1f3b30"/><text x="6" y="${y(v)+4}">${v}</text>`;
 g+=SERIES.m.map((m,i)=>`<text x="${x(i)-8}" y="${H-12}">${m}</text>`).join("");
 g+=line(SERIES.rem,"#2ee59d")+line(SERIES.it,"#f5c542");
 g+=`<text x="${p}" y="14" style="fill:#2ee59d">● ${L==="ur"?"ترسیلات":"Remittances"}</text><text x="${p+120}" y="14" style="fill:#f5c542">● ${L==="ur"?"آئی ٹی":"IT exports"}</text>`;
 $("#ch1").innerHTML=g;
 $("#ch2").innerHTML=RAILS.map((r,i)=>`<text x="8" y="${48+i*46}">${r.n}</text><rect x="70" y="${30+i*46}" width="${r.v*8}" height="26" rx="6" fill="${["#2ee59d","#f5c542","#4fb3ff","#ff8fa3"][i]}"/><text x="${76+r.v*8}" y="${48+i*46}" style="fill:#e8f3ee">${r.v}%</text>`).join("");
}
function calc(){
 const usd=+$("#r_usd").value,fx=+$("#r_fx").value,tx=+$("#r_tax").value/100,fee=+$("#r_fee").value;
 $("#r_out").innerHTML=`${t("gets")}: <b>${pkr((usd-fee)*fx*(1-tx))}</b> (${t("aft")})`;
 const a=+$("#i_amt").value,y=$("#i_yr").value||"2021";
 $("#i_out").innerHTML=`${pkr(a)} (${y}) ${t("eq")} <b>${pkr(a*CPI_FACTOR[y])}</b> ${t("tdy")}`;
 const P=+$("#l_amt").value,n=+$("#l_ten").value,emi=(r)=>{r=r/1200;return r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n};
 const e0=emi(+$("#l_old").value),e1=emi(+$("#l_new").value);
 $("#l_out").innerHTML=`${t("emi")}: ${pkr(e0)} → <b>${pkr(e1)}</b><br>${t("save")}: <b>${pkr(e0-e1)}</b> ${t("pm")} · ${pkr((e0-e1)*n)} ${t("tot")}`;
}
function exportCSV(){
 const esc=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
 const rows=[["id","category","metric_en","metric_ur","value","unit","as_of","source"],...DATA.map(d=>[d.id,d.cat,d.en,d.ur,d.v,d.u,d.asof,d.src])];
 const blob=new Blob(["\ufeff"+rows.map(r=>r.map(esc).join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pakpulse-national-metrics.csv";a.click();URL.revokeObjectURL(a.href);
}
function tick(){$("#clock").textContent="PKT "+new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Karachi",dateStyle:"medium",timeStyle:"medium",hour12:false}).format(new Date())}
$("#lang").onclick=()=>{L=L==="en"?"ur":"en";localStorage.setItem("pp_lang",L);applyLang()};
$("#csv").onclick=exportCSV;$("#q").oninput=render;
document.querySelectorAll(".box input,.box select").forEach(e=>e.oninput=calc);
tick();setInterval(tick,1000);applyLang();
</script>
